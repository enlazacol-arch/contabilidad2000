<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enlaza — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:ital,wght@0,400..800;1,400&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="/tokens.css">
<style>
  :root{
    --paper:var(--n-50); --paper-raised:#FFFFFF; --line:var(--n-200);
    --ink:var(--n-900); --ink-soft:var(--n-700); --ink-faint:var(--n-500);
    --petroleo:var(--pet-600); --petroleo-deep:var(--pet-800);
    --coral:var(--coral-600); --coral-deep:var(--coral-700);
    --ember:var(--egreso-fill); --ember-deep:var(--egreso); --moss:var(--ingreso-fill); --clay:var(--clay);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(900px 460px at -5% -10%, rgba(11,79,108,0.08), transparent 55%),
      radial-gradient(800px 440px at 105% 10%, rgba(255,107,74,0.06), transparent 55%),
      radial-gradient(700px 400px at 50% 115%, rgba(11,79,108,0.05), transparent 55%);
    color:var(--ink);
    font-family:var(--font-ui);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
  }
  .login-wrap{ width:100%; max-width:380px; }
  .mascot-login{
    display:block; width:112px; margin:0 auto -46px; position:relative; z-index:2;
    filter:drop-shadow(0 14px 20px rgba(11,79,108,0.18));
    animation:mascotFloat 5s ease-in-out infinite;
  }
  @keyframes mascotFloat{
    0%,100%{ transform:translateY(0) rotate(-1.5deg); }
    50%{ transform:translateY(-6px) rotate(1.5deg); }
  }
  @media (prefers-reduced-motion:reduce){ .mascot-login{ animation:none; } }
  .card{
    width:100%; text-align:center;
    background:var(--paper-raised); border:1px solid var(--line);
    border-top:4px solid var(--petroleo);
    border-radius:var(--r-lg); padding:var(--s-12) var(--s-8) var(--s-10);
    box-shadow:var(--sh-3);
    position:relative;
  }
  .logo-mark{
    width:48px; height:48px; border-radius:var(--r-md); margin:0 auto 20px;
    background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 22px -8px rgba(11,79,108,0.25);
  }
  .logo-mark svg,
  .logo-mark img{ width:32px; height:32px; display:block; object-fit:contain; }
  h1{
    font-family:var(--font-display); font-weight:800; letter-spacing:-0.02em;
    font-size:var(--t-30); line-height:var(--lh-tight); margin:0 0 var(--s-2); color:var(--text);
  }
  p{ color:var(--ink-soft); font-size:var(--t-16); line-height:1.55; margin:0 0 var(--s-8); text-wrap:pretty; }
  #googleBtn{ display:flex; justify-content:center; }
  #errBox{
    display:none; margin-top:var(--s-4); font-size:var(--t-14); color:var(--err);
    background:var(--err-bg); border:1px solid var(--err-line);
    padding:var(--s-3) var(--s-4); border-radius:var(--r-md); text-align:left;
  }
  #errBox.show{ display:block; }
  .fine{
    margin-top:var(--s-8); padding-top:var(--s-5); border-top:1px solid var(--line);
    font-family:var(--font-ui); font-size:var(--t-13);
    color:var(--ink-faint); line-height:1.6;
  }
  .fine a{ color:var(--petroleo); text-decoration:underline; text-underline-offset:2px; }
  .fine a:hover{ color:var(--petroleo-deep); }
  @media (max-width:420px){ .card{ padding:var(--s-12) var(--s-5) var(--s-8); } }
</style>
</head>
<body>
  <div class="login-wrap">
    <img class="mascot-login" src="/img/mascot-wave.png" alt="" draggable="false">
    <div class="card">
    <div class="logo-mark"><img src="/img/logo-icon.png" alt="Enlaza" draggable="false"></div>
    <h1>Enlaza</h1>
    <p>Inicia sesión con tu cuenta de Google para entrar a tu kárdex.</p>
    <div id="googleBtn"></div>
    <div id="errBox"></div>
    <div class="fine">Cada cuenta ve solo sus propios clientes y facturas.<br>
      Al iniciar sesión, aceptas los <a href="/terminos.html">Términos de Uso</a> y la
      <a href="/privacidad.html">Política de Privacidad</a>.
    </div>
    </div>
  </div>


<script>
async function handleCredentialResponse(response) {
  const errBox = document.getElementById('errBox');
  errBox.classList.remove('show');
  try {
    const res = await fetch('/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'No se pudo iniciar sesión.');
    window.location.href = '/';
  } catch (e) {
    errBox.textContent = 'No se pudo iniciar sesión: ' + e.message;
    errBox.classList.add('show');
  }
}

window.onload = function () {
  if (!window.GOOGLE_CLIENT_ID) {
    document.getElementById('errBox').textContent = 'Falta configurar GOOGLE_CLIENT_ID en el servidor.';
    document.getElementById('errBox').classList.add('show');
    return;
  }
  google.accounts.id.initialize({
    client_id: window.GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById('googleBtn'),
    { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill' }
  );
};
</script>
</body>
</html>
